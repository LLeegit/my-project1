// Isolated Docker test only: never copied to the user's Zotero installation.
var { setTimeout } = ChromeUtils.importESModule('resource://gre/modules/Timer.sys.mjs');
var { AddonManager } = ChromeUtils.importESModule('resource://gre/modules/AddonManager.sys.mjs');
function saveResult(result) {
  var file = Cc['@mozilla.org/file/local;1'].createInstance(Ci.nsIFile);
  file.initWithPath('/workspace/test-results/runtime-install.json');
  var output = Cc['@mozilla.org/network/file-output-stream;1'].createInstance(Ci.nsIFileOutputStream);
  output.init(file, 0x02 | 0x08 | 0x20, 0o644, 0);
  var converter = Cc['@mozilla.org/intl/converter-output-stream;1'].createInstance(Ci.nsIConverterOutputStream);
  converter.init(output, 'UTF-8');
  converter.writeString(JSON.stringify(result, null, 2)); converter.close();
  dump('ZSH_RUNTIME_RESULT ' + JSON.stringify(result) + '\n');
}
var result = { appVersion: Services.appinfo.version, platform: Services.appinfo.OS, cases: [] };
async function run(win) {
  try {
    await win.Zotero.initializationPromise;
    await win.Zotero.uiReadyPromise;
    // Keep the native security setting at its default. No user profile is involved.
    result.checkUpdateSecurity = AddonManager.checkUpdateSecurity;
    var paths = Services.env.get('ZSH_TEST_XPIS').split('|');
    for (var path of paths) {
      var file = Cc['@mozilla.org/file/local;1'].createInstance(Ci.nsIFile); file.initWithPath(path);
      var install = await AddonManager.getInstallForFile(file);
      var record = { path, state: install.state, error: install.error,
        version: install.addon?.version, appDisabled: install.addon?.appDisabled,
        isCompatible: install.addon?.isCompatible, isPlatformCompatible: install.addon?.isPlatformCompatible,
        providesUpdatesSecurely: install.addon?.providesUpdatesSecurely };
      result.cases.push(record);
      if (install.addon && !install.addon.appDisabled) {
        await install.install();
        await new Promise(resolve => setTimeout(resolve, 2000));
        var addon = await AddonManager.getAddonByID('search-highlighter@local.zotero');
        record.installed = !!addon;
        record.isActive = addon?.isActive;
        record.menuPresent = !!win.document.getElementById('zsh-tools-menu');
        record.stylePresent = [...win.document.querySelectorAll('style')].some(el => el.textContent.includes('.zsh-match'));
        // Synthetic record lives only in the fresh /tmp Docker data directory.
        var item = new win.Zotero.Item('journalArticle');
        item.setField('title', 'Cell segmentation runtime fixture');
        item.setField('abstractNote', 'Cell segmentation is a synthetic test.');
        item.setCreators([{ firstName: 'Test', lastName: 'Cell', creatorType: 'author' }]);
        await item.saveTx();
        await win.ZoteroPane.selectItems([item.id]);
        await new Promise(resolve => setTimeout(resolve, 800));
        var search = win.document.getElementById('zotero-tb-search');
        search.value = 'cell';
        search.dispatchEvent(new win.Event('input', { bubbles: true }));
        await new Promise(resolve => setTimeout(resolve, 1200));
        var view = win.ZoteroPane.itemsView;
        var index = view.getRowIndexByID(item.id);
        var titleCell = view._renderCell(index, item.getField('title'), { dataKey: 'title', className: 'title' }, false);
        var creatorCell = view._renderCell(index, 'Cell', { dataKey: 'firstCreator', className: 'firstCreator' }, false);
        record.titleHighlight = titleCell.querySelector('mark')?.textContent;
        record.creatorHighlight = creatorCell.querySelector('mark')?.textContent;
        record.infoHighlightCount = win.document.querySelectorAll('.zsh-info-overlay mark').length;
        search.value = '';
        search.dispatchEvent(new win.Event('input', { bubbles: true }));
        await new Promise(resolve => setTimeout(resolve, 500));
        record.infoClearWorked = !win.document.querySelector('.zsh-info-overlay');
        await addon.disable();
        record.menuRemovedOnDisable = !win.document.getElementById('zsh-tools-menu');
        await addon.uninstall();
      }
    }
  }
  catch (error) { result.error = String(error); result.stack = error.stack; }
  saveResult(result);
  Services.startup.quit(Ci.nsIAppStartup.eAttemptQuit);
}
function findWindow(attempt) {
  for (var win of Services.wm.getEnumerator(null)) {
    if (win.Zotero && win.ZoteroPane) { run(win); return; }
  }
  if (attempt > 90) { result.error = 'Main window timeout'; saveResult(result); Services.startup.quit(Ci.nsIAppStartup.eForceQuit); return; }
  setTimeout(() => findWindow(attempt + 1), 500);
}
Services.obs.addObserver(function observer() {
  Services.obs.removeObserver(observer, 'final-ui-startup');
  setTimeout(() => findWindow(0), 500);
}, 'final-ui-startup');
